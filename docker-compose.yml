services:
  db:
    image: mariadb:10.6
    restart: no
    volumes:
      - dbstore:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: very-stronk
    
  site:
    build: .
    depends_on:
      - db
    image: php-assignment:local
    restart: no
    volumes:
      - ./html:/var/www/html
    ports:
      - 8082:80
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: very-stronk
  
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
      - 8081:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: very-stronk

volumes:
  dbstore: